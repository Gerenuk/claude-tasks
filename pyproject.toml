[project]
name = "claude-tasks"
version = "0.1.0"
description = "File, list and start deferred Claude work: ideas as OKF Markdown records."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["itemctl"]

[project.scripts]
claude-tasks = "claude_tasks.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[tool.uv.sources]
itemctl = { git = "https://github.com/Gerenuk/ItemCtl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_tasks"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Ephemeral design notes; their Python snippets are quotations, not project code.
extend-exclude = ["temp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S110", "FA"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
addopts = "-n auto"
empty_parameter_set_mark = "fail_at_collect"
